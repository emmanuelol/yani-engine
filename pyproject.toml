[project]
name = "dumbledoer"
version = "0.1.0"
description = "DumbleDoer Agentic Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "google-genai>=2.8.0",
 "mcp>=1.27.2",
 "python-dotenv>=1.2.2",
 "rich>=15.0.0",
 "typer>=0.26.7",
]

[project.scripts]
dumbledoer = "dumbledoer.dumbledoer_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
