[project]
name = "yani-engine"
version = "1.0.0"
description = "yani-engine Agentic Harness 🐩"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "google-genai>=2.8.0",
 "mcp>=1.27.2",
 "python-dotenv>=1.2.2",
 "rich>=15.0.0",
 "typer>=0.26.7",
 "filelock>=3.13.0",
 "markdown-it-py>=3.0.0",
 "pydantic-settings>=2.0.0",
 "httpx>=0.27.0",
]

[project.scripts]
yani = "yani_engine.cli.main:main"
yani-engine = "yani_engine.cli.main:main"
dumbledoer = "yani_engine.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
